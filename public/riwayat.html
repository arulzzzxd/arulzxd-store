<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riwayat Transaksi - ArulzXD Store</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        neoYellow: '#FFDE59',
                        neoCyan: '#00E5FF',
                        neoPink: '#FF79C6',
                        neoGreen: '#00E676',
                        neoBg: '#F4F0EA',
                        neoCard: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F4F0EA; color: #000000; overflow-x: hidden; }
        
        .neo-box {
            background-color: #FFFFFF;
            border: 3px solid #000000;
            box-shadow: 5px 5px 0px #000000;
        }

        .neo-btn {
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .neo-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* FLUID CURVED NOTCH BOTTOM NAVIGATION BAR */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 440px;
            height: 64px;
            z-index: 9999;
        }

        .bottom-nav-bg {
            position: absolute;
            inset: 0;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 32px;
            box-shadow: 5px 5px 0px #000000;
        }

        .nav-items-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100%;
            width: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 100%;
            color: #000000;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent;
        }

        .nav-item-btn i { font-size: 18px; transition: all 0.3s ease; }
        .nav-item-btn span {
            font-size: 10px;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            position: absolute;
            bottom: 6px;
            transition: all 0.3s ease;
        }

        .nav-item-btn.active .nav-icon-box {
            transform: translateY(-22px);
            background-color: #FFDE59;
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
        }

        .nav-item-btn.active i { font-size: 20px; }
        .nav-item-btn.active span {
            color: #000000;
            font-weight: 900;
            transform: translateY(-2px);
        }

        .nav-item-btn.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 5px;
            height: 5px;
            background-color: #000000;
            border-radius: 50%;
        }
    </style>
</head>
<body class="font-sans antialiased text-black min-h-screen pb-32">

    <!-- TOP NAVBAR -->
    <nav class="sticky top-0 z-40 bg-neoYellow border-b-3 border-black shadow-[0_4px_0_#000]">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/store" class="text-2xl font-black font-cyber tracking-tight text-black">
                Arulz<span class="bg-black text-white px-2 py-0.5 ml-1 rounded-md">Store</span>
            </a>
            <button onclick="loadTransactions()" class="neo-btn bg-white text-black font-cyber font-black px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-6 space-y-5">
        <div class="p-6 neo-box rounded-2xl bg-neoCyan flex items-center justify-between">
            <div>
                <h1 class="text-xl sm:text-3xl font-black text-black font-cyber flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i> Riwayat Transaksi
                </h1>
                <p class="text-xs sm:text-sm font-bold text-black mt-1">Seluruh daftar transaksi akun Anda tersimpan permanen di database.</p>
            </div>
        </div>

        <!-- LIST TRANSAKSI -->
        <div id="historyList" class="space-y-3">
            <div class="neo-box rounded-xl p-4 text-center text-xs font-cyber font-black bg-white animate-pulse">
                Memuat riwayat transaksi dari server...
            </div>
        </div>
    </div>

    <!-- CURVED ANIMATED BOTTOM NAV BAR -->
    <div class="bottom-nav-fixed">
        <div class="bottom-nav-bg"></div>
        <div class="nav-items-wrapper">
            <a href="/dashboard" class="nav-item-btn">
                <div class="nav-icon-box">
                    <i class="fa-solid fa-house"></i>
                </div>
                <span>Home</span>
            </a>
            <a href="/store" class="nav-item-btn">
                <div class="nav-icon-box">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
                <span>Toko</span>
            </a>
            <a href="/deposit" class="nav-item-btn">
                <div class="nav-icon-box">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span>Deposit</span>
            </a>
            <a href="/riwayat" class="nav-item-btn active">
                <div class="nav-icon-box">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <span>Riwayat</span>
            </a>
            <a href="/profile" class="nav-item-btn">
                <div class="nav-icon-box">
                    <i class="fa-regular fa-user"></i>
                </div>
                <span id="nav-auth-label">Profil</span>
            </a>
        </div>
    </div>

    <script>
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka || 0);
        }

        async function loadTransactions() {
            const listEl = document.getElementById('historyList');
            
            let localOrders = JSON.parse(localStorage.getItem('my_orders_history') || '[]');
            const activeOrder = localStorage.getItem('active_order_id');
            if (activeOrder && !localOrders.includes(activeOrder)) localOrders.push(activeOrder);

            try {
                const res = await fetch(`/api/user/transactions?orderIds=${localOrders.join(',')}`);
                const data = await res.json();

                if (!res.ok || !data.status || !data.transactions || data.transactions.length === 0) {
                    listEl.innerHTML = `
                        <div class="neo-box rounded-2xl p-8 text-center space-y-3 bg-white">
                            <i class="fa-solid fa-receipt text-5xl text-black"></i>
                            <h3 class="text-sm font-black font-cyber">Belum Ada Riwayat Transaksi</h3>
                            <p class="text-xs font-bold text-slate-600 max-w-sm mx-auto">Anda belum melakukan transaksi. Pesanan atau deposit Anda akan tersimpan secara permanen di akun Anda.</p>
                            <a href="/store" class="neo-btn inline-block bg-neoYellow text-black font-cyber font-black px-4 py-2 rounded-xl text-xs uppercase">
                                Belanja Sekarang
                            </a>
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = data.transactions.map(trx => {
                    const status = (trx.status || 'pending').toLowerCase();
                    let badgeClass = 'bg-neoYellow text-black border-2 border-black';
                    let statusLabel = 'PENDING';

                    if (['settlement','success','paid','settled'].includes(status)) {
                        badgeClass = 'bg-neoGreen text-black border-2 border-black';
                        statusLabel = 'BERHASIL / LUNAS';
                    } else if (['cancelled','failed','expired'].includes(status)) {
                        badgeClass = 'bg-neoPink text-black border-2 border-black';
                        statusLabel = 'DIBATALKAN';
                    }

                    const typeTag = trx.type === 'DEPOSIT' 
                        ? `<span class="text-[10px] bg-neoCyan text-black border border-black font-black px-2 py-0.5 rounded mr-2 uppercase">DEPOSIT</span>` 
                        : `<span class="text-[10px] bg-neoYellow text-black border border-black font-black px-2 py-0.5 rounded mr-2 uppercase">PEMBELIAN</span>`;

                    const namaProduk = trx.itemDetails?.nama || (trx.type === 'DEPOSIT' ? 'Deposit Saldo' : 'Produk Store');
                    const harga = trx.amount || trx.itemDetails?.harga || 0;
                    const dateStr = trx.createdAt ? new Date(trx.createdAt).toLocaleString('id-ID') : '-';

                    let linkBtn = '';
                    if (trx.type !== 'DEPOSIT' && ['settlement','success','paid','settled'].includes(status) && (trx.productLink || trx.itemDetails?.link)) {
                        const link = trx.productLink || trx.itemDetails?.link;
                        linkBtn = `
                            <a href="${link}" target="_blank" class="neo-btn text-xs bg-neoCyan text-black font-black px-3 py-1.5 rounded-lg inline-flex items-center gap-1 mt-2 font-cyber">
                                <i class="fa-solid fa-cloud-arrow-down"></i> Akses Produk
                            </a>
                        `;
                    }

                    return `
                        <div class="neo-box rounded-xl p-4 bg-white space-y-2">
                            <div class="flex items-center justify-between border-b-2 border-black pb-2">
                                <span class="text-[11px] font-mono font-bold">Order ID: <strong class="text-black font-black">${trx.orderId}</strong></span>
                                <span class="text-[10px] font-black font-cyber px-2.5 py-0.5 rounded-full ${badgeClass} uppercase">${statusLabel}</span>
                            </div>
                            <div class="flex items-start justify-between gap-3 pt-1">
                                <div>
                                    <h4 class="text-sm font-black font-cyber text-black flex items-center">${typeTag}${namaProduk}</h4>
                                    <p class="text-[11px] font-bold text-slate-600 mt-1">Waktu: ${dateStr}</p>
                                    ${linkBtn}
                                </div>
                                <div class="text-right">
                                    <span class="text-xs font-bold text-slate-600 block">Total Tagihan:</span>
                                    <span class="text-sm font-black font-cyber text-black">${formatRupiah(harga)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch(err) {
                listEl.innerHTML = `<div class="neo-box p-4 bg-neoPink text-center text-xs font-black font-cyber">Gagal memuat data transaksi.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTransactions();
            fetch('/api/user-status')
                .then(res => res.json())
                .then(data => {
                    const authLabel = document.getElementById('nav-auth-label');
                    if (data.loggedIn && data.user) {
                        if (authLabel) authLabel.innerText = 'Profil';
                    } else {
                        if (authLabel) authLabel.innerText = 'Login';
                    }
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
