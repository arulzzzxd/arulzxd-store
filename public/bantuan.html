<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusat Bantuan & Live Chat - ArulzXD Store</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], cyber: ['Orbitron', 'sans-serif'] },
                    colors: { cyberCyan: '#00f3ff', cyberDark: '#050b14', cyberCard: '#0a1628', cyberBorder: '#162a45' },
                    boxShadow: { glowCyan: '0 0 15px rgba(0, 243, 255, 0.35)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050b14; color: #e2e8f0; }
        .bg-cyber-grid {
            background-image: linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="font-sans antialiased bg-cyberDark bg-cyber-grid text-slate-100 min-h-screen flex flex-col justify-between pb-10">

    <!-- TOP NAVBAR -->
    <nav class="sticky top-0 z-40 bg-cyberDark/90 backdrop-blur-md border-b border-cyberBorder p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/store" class="text-xl font-black font-cyber text-cyberCyan">Arulz<span class="text-white">Store</span></a>
            <div id="ownerBadge" class="hidden text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                <i class="fa-solid fa-user-shield mr-1"></i> Mode Owner CS
            </div>
        </div>
    </nav>

    <!-- CHAT CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 py-6 w-full flex-1 flex flex-col">
        <div class="bg-cyberCard border border-cyberBorder rounded-2xl shadow-xl flex-1 flex flex-col overflow-hidden min-h-[550px]">
            
            <!-- HEADER CHAT & OPSI MODE -->
            <div class="p-4 border-b border-cyberBorder flex flex-wrap items-center justify-between gap-3 bg-cyberDark/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-cyberCyan/10 border border-cyberCyan/40 flex items-center justify-center text-cyberCyan">
                        <i id="chatHeaderIcon" class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <div>
                        <h3 id="chatTitle" class="text-xs font-bold font-cyber text-white uppercase">Copilot AI Assistant</h3>
                        <p id="chatSubtitle" class="text-[10px] text-emerald-400 font-mono">● Online 24/7</p>
                    </div>
                </div>

                <!-- OPSI PENUKARAN CHAT COPILOT / OWNER -->
                <div class="flex bg-cyberDark p-1 rounded-xl border border-cyberBorder">
                    <button onclick="switchChatMode('copilot')" id="btnModeCopilot" class="px-3 py-1.5 rounded-lg text-xs font-bold font-cyber bg-cyberCyan text-cyberDark transition">
                        <i class="fa-solid fa-robot mr-1"></i> Copilot AI
                    </button>
                    <button onclick="switchChatMode('owner')" id="btnModeOwner" class="px-3 py-1.5 rounded-lg text-xs font-bold font-cyber text-slate-400 hover:text-white transition">
                        <i class="fa-headset fa-solid mr-1"></i> CS Owner
                    </button>
                </div>
            </div>

            <!-- CHAT MESSAGES PANEL -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 font-sans text-xs">
                <div class="text-center text-slate-500 text-[10px] my-2 font-mono">
                    --- Percakapan Tersimpan Permanen di MongoDB ---
                </div>
            </div>

            <!-- INPUT BOX WA-STYLE -->
            <form onsubmit="sendMessage(event)" class="p-3 bg-cyberDark border-t border-cyberBorder flex items-center gap-2">
                <input type="text" id="chatInput" placeholder="Tuliskan pertanyaan Anda..." required
                    class="flex-1 bg-cyberCard border border-cyberBorder rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyberCyan transition">
                <button type="submit" class="bg-cyberCyan hover:bg-cyan-300 text-cyberDark font-bold w-10 h-10 rounded-xl flex items-center justify-center transition shadow-glowCyan">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>

        </div>
    </main>

    <script>
    let sessionId = '';
    let currentMode = 'ai'; // 'ai' atau 'owner'

    async function initChat() {
        try {
            const res = await fetch('/api/support/history');
            const data = await res.json();
            if (data.status) {
                sessionId = data.sessionId;
                renderMessages(data.messages);
            }
        } catch (e) {
            console.error("Gagal inisialisasi chat:", e);
        }
    }

    function renderMessages(messages) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        container.innerHTML = messages.map(m => {
            const isUser = m.sender === 'user';
            const alignClass = isUser ? 'justify-end' : 'justify-start';
            const bgClass = isUser 
                ? 'bg-cyberCyan/20 border-cyberCyan/40 text-cyan-100' 
                : 'bg-slate-800/80 border-slate-700 text-slate-200';
            const senderLabel = isUser ? (m.senderName || 'Anda') : (m.senderName || 'Copilot AI');

            return `
                <div class="flex ${alignClass} mb-3">
                    <div class="max-w-[80%] border p-3 rounded-2xl ${bgClass} space-y-1 shadow-md">
                        <span class="text-[9px] font-bold font-cyber uppercase tracking-wider block opacity-70">
                            <i class="${isUser ? 'fa-solid fa-user' : 'fa-solid fa-robot'} mr-1"></i> ${senderLabel}
                        </span>
                        <p class="leading-relaxed text-sm whitespace-pre-wrap">${m.text}</p>
                        <span class="text-[8px] opacity-40 block text-right font-mono">
                            ${new Date(m.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}
                        </span>
                    </div>
                </div>
            `;
        }).join('');

        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
        if (e) e.preventDefault();
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';

        try {
            const res = await fetch('/api/support/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId, text, mode: currentMode })
            });
            const data = await res.json();
            if (data.status) {
                renderMessages(data.messages);
            }
        } catch(e) {
            console.error("Gagal mengirim pesan:", e);
        }
    }

    document.addEventListener('DOMContentLoaded', initChat);
</script>

</body>
</html>
