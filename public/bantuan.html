<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantuan & Live Chat - ArulzXD Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050b14; font-family: 'Plus Jakarta Sans', sans-serif; color: #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- FLOATING CHAT CARD CONTAINER -->
    <div class="w-full max-w-md bg-[#0a1628] border border-[#162a45] rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[600px] relative">
        
        <!-- HEADER LIVE CHAT -->
        <div class="bg-[#111827] p-4 border-b border-[#162a45] flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-[#f95700] text-white flex items-center justify-center font-bold text-lg shadow-[0_0_12px_rgba(249,87,0,0.5)]">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <span class="absolute top-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#0a1628] rounded-full"></span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white">Customer Support</h3>
                    <p class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online 24/7
                    </p>
                </div>
            </div>
            <a href="/dashboard" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <!-- CHAT MESSAGES CONTAINER -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#050b14]/60">
            <div class="text-center text-xs text-slate-500 my-2">Memuat riwayat chat bantuan...</div>
        </div>

        <!-- INPUT CHAT BOX -->
        <form id="chatForm" onsubmit="sendMessage(event)" class="p-3 bg-[#111827] border-t border-[#162a45] flex items-center gap-2">
            <input type="text" id="chatInput" required placeholder="Tuliskan pertanyaan Anda..." 
                   class="flex-1 bg-[#050b14] border border-[#162a45] rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#f95700] transition">
            <button type="submit" id="btnSend" class="w-10 h-10 rounded-xl bg-[#f95700] hover:bg-[#e04e00] text-white flex items-center justify-center transition shadow-[0_0_10px_rgba(249,87,0,0.4)]">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>

    </div>

    <!-- FLOATING LAUNCHER BUTTON DI SUDUT BAWAH -->
    <a href="/bantuan" title="Bantuan & Live Chat" class="fixed bottom-6 right-6 z-50 flex items-center justify-center w-14 h-14 rounded-full bg-[#f95700] text-white shadow-[0_0_20px_rgba(249,87,0,0.6)] hover:scale-110 transition-transform duration-200">
        <i class="fa-solid fa-comment-dots text-2xl"></i>
        <span class="absolute top-0 right-0 w-4 h-4 bg-emerald-500 border-2 border-slate-950 rounded-full"></span>
    </a>

    <script>
        let pollInterval = null;

        async function loadMessages() {
            try {
                const res = await fetch('/api/bantuan/messages');
                const data = await res.json();
                const container = document.getElementById('chatMessages');

                if (data.status && data.messages) {
                    if (data.messages.length === 0) {
                        container.innerHTML = `
                            <div class="bg-[#111827] p-3 rounded-2xl border border-[#162a45] text-xs text-slate-300 space-y-1">
                                <p class="font-bold text-[#f95700]">Halo! Selamat datang di Live Chat CS 👋</p>
                                <p class="text-[11px] text-slate-400">Ada yang bisa kami bantu? Silakan tuliskan pertanyaan Anda di bawah ini.</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = data.messages.map(msg => {
                        const isUser = msg.sender === 'user';
                        const alignClass = isUser ? 'justify-end' : 'justify-start';
                        const bgClass = isUser ? 'bg-[#f95700] text-white rounded-br-none' : 'bg-[#111827] border border-[#162a45] text-slate-200 rounded-bl-none';
                        const timeStr = new Date(msg.createdAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                        return `
                            <div class="flex ${alignClass}">
                                <div class="max-w-[80%] p-3 rounded-2xl text-xs space-y-1 ${bgClass}">
                                    <p class="leading-relaxed break-words">${msg.message}</p>
                                    <span class="text-[9px] opacity-70 block text-right font-mono">${timeStr}</span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    container.scrollTop = container.scrollHeight;
                }
            } catch(e) {}
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';

            try {
                await fetch('/api/bantuan/send-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                loadMessages();
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            pollInterval = setInterval(loadMessages, 3000); // Auto refresh pesan tiap 3 detik
        });
    </script>
</body>
</html>
