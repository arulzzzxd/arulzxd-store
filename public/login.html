<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autentikasi - ArulzXD STORE</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        neoYellow: '#FFDE59',
                        neoCyan: '#00E5FF',
                        neoPink: '#FF79C6',
                        neoGreen: '#00E676',
                        neoBg: '#F5F2EB',
                        neoCard: '#FFFFFF'
                    }
                } 
            }
        }
    </script>
    <style>
        body { 
            background-color: #F5F2EB; 
            background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1.2px, transparent 1.2px);
            background-size: 16px 16px;
            color: #000000;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        .viewport-outer-border {
            position: fixed;
            inset: 8px;
            border: 4px solid #000000;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0 0 2px #FFFFFF;
        }

        .neo-box {
            background-color: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }

        .neo-btn {
            border: 3.5px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
        }
        .neo-btn:not(:disabled):hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .neo-btn:not(:disabled):active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* STATE TOMBOL MEMUDAR DAN TIDAK BISA DIKLIK */
        .btn-disabled {
            opacity: 0.45 !important;
            filter: grayscale(40%) !important;
            pointer-events: none !important;
            cursor: not-allowed !important;
            box-shadow: 2px 2px 0px #000000 !important;
            transform: none !important;
        }

        .tab-nav-btn {
            background-color: #FFFFFF;
            border: 3px solid #000000;
            box-shadow: 3.5px 3.5px 0px #000000;
            transition: all 0.15s ease;
        }
        .tab-nav-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4.5px 4.5px 0px #000000;
        }
        .tab-nav-btn.active {
            background-color: #FFDE59;
            transform: translate(2px, 2px);
            box-shadow: 1.5px 1.5px 0px #000000;
        }

        .neo-input {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.15s ease;
        }
        .neo-input:focus {
            box-shadow: 5px 5px 0px #000000;
            background-color: #FFFFFF;
        }

        .hidden-form { display: none; }

        .swal2-popup.cyber-swal {
            background: #FFFFFF !important;
            border: 3.5px solid #000000 !important;
            border-radius: 20px !important;
            color: #000000 !important;
            box-shadow: 6px 6px 0px #000000 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .brutal-glitch {
            position: relative;
            display: inline-block;
            color: #000000;
        }

        .brutal-glitch::before,
        .brutal-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .brutal-glitch::before {
            left: -2px;
            text-shadow: 2px 0 #00E5FF;
            clip: rect(24px, 550px, 90px, 0);
            animation: brutal-glitch-anim-1 3.5s infinite ease-in-out;
        }

        .brutal-glitch::after {
            left: 2px;
            text-shadow: -2px 0 #FF79C6;
            clip: rect(85px, 550px, 140px, 0);
            animation: brutal-glitch-anim-2 4.2s infinite ease-in-out;
        }

        @keyframes brutal-glitch-anim-1 {
            0% { clip: rect(0, 0, 0, 0); transform: none; }
            5% { clip: rect(10px, 9999px, 35px, 0); transform: skew(3deg) translateX(-3px); }
            10% { clip: rect(45px, 9999px, 80px, 0); transform: skew(-2deg) translateX(4px); }
            15% { clip: rect(0, 0, 0, 0); transform: none; }
            45% { clip: rect(0, 0, 0, 0); transform: none; }
            50% { clip: rect(20px, 9999px, 55px, 0); transform: skew(4deg) translateX(-4px); }
            55% { clip: rect(70px, 9999px, 105px, 0); transform: skew(-3deg) translateX(3px); }
            60% { clip: rect(0, 0, 0, 0); transform: none; }
            100% { clip: rect(0, 0, 0, 0); transform: none; }
        }

        @keyframes brutal-glitch-anim-2 {
            0% { clip: rect(0, 0, 0, 0); transform: none; }
            20% { clip: rect(0, 0, 0, 0); transform: none; }
            25% { clip: rect(55px, 9999px, 85px, 0); transform: skew(-4deg) translateX(4px); }
            30% { clip: rect(15px, 9999px, 45px, 0); transform: skew(2deg) translateX(-3px); }
            35% { clip: rect(0, 0, 0, 0); transform: none; }
            75% { clip: rect(0, 0, 0, 0); transform: none; }
            80% { clip: rect(35px, 9999px, 70px, 0); transform: skew(-3deg) translateX(3px); }
            85% { clip: rect(80px, 9999px, 115px, 0); transform: skew(4deg) translateX(-4px); }
            90% { clip: rect(0, 0, 0, 0); transform: none; }
            100% { clip: rect(0, 0, 0, 0); transform: none; }
        }

        #cyber-loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #F5F2EB;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #cyber-loader-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .animated-dots::after {
            content: '';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotsAnimation 1.5s steps(4, end) infinite;
        }
        @keyframes dotsAnimation {
            0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-3 sm:p-4 antialiased text-black">

    <div class="viewport-outer-border"></div>

    <!-- LOADER OVERLAY -->
    <div id="cyber-loader-overlay">
        <div class="neo-box p-6 rounded-2xl flex flex-col items-center bg-white">
            <img src="https://files.catbox.moe/kdowze.png" alt="Logo" class="w-20 h-20 rounded-full border-3 border-black mb-4 shadow-[4px_4px_0px_#000]">
            <div id="loader-title-text" class="text-base font-black tracking-wider uppercase font-cyber mb-1">
                Memuat Halaman Portal<span class="animated-dots"></span>
            </div>
            <div class="text-[11px] font-bold font-mono tracking-wider uppercase bg-neoYellow border-2 border-black px-2 py-0.5">
                SYSTEM INITIALIZING
            </div>
            <div class="w-64 mt-6">
                <div class="flex items-center justify-between text-xs font-black font-cyber mb-1">
                    <span>STATUS</span>
                    <span id="loader-percentage">0%</span>
                </div>
                <div class="w-full h-4 bg-white rounded-none border-3 border-black p-0.5">
                    <div id="loader-progress-fill" class="h-full bg-neoCyan w-0 border-r-2 border-black"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CARD PORTAL AUTHENTICATION -->
    <div class="neo-box p-5 sm:p-7 rounded-2xl w-full max-w-md bg-white relative overflow-hidden flex flex-col justify-between my-auto z-10">
        
        <div class="text-left relative z-10 pt-1 pb-3 border-b-3 border-black">
            <h1 class="text-2xl sm:text-3xl font-black font-cyber tracking-tight uppercase leading-none">
                <span class="brutal-glitch" data-text="ArulzXD-STORE">ArulzXD-STORE</span>
            </h1>
            <p class="text-[10px] sm:text-[11px] font-mono font-bold text-slate-700 tracking-wider uppercase mt-1.5 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-neoGreen inline-block border border-black animate-pulse"></span>
                - AUTHENTICATION PORTAL -
            </p>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="grid grid-cols-3 gap-2 my-4">
            <button id="tab-login" onclick="switchTab('signin')" class="tab-nav-btn active py-2 text-xs font-black font-cyber uppercase tracking-wider text-black rounded-xl">
                LOGIN
            </button>
            <button id="tab-register" onclick="switchTab('signup')" class="tab-nav-btn py-2 text-xs font-black font-cyber uppercase tracking-wider text-black rounded-xl">
                REGISTER
            </button>
            <button id="tab-forgot" onclick="switchTab('forgot')" class="tab-nav-btn py-2 text-xs font-black font-cyber uppercase tracking-wider text-black rounded-xl">
                RESET PW
            </button>
        </div>

        <!-- ================= FORM SIGN IN ================= -->
        <div id="signin-form" class="space-y-3.5 relative z-10 my-1">
            <form id="loginForm" action="/auth/login" method="POST" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-1">
                        USERNAME / EMAIL
                    </label>
                    <input type="text" id="login-username" name="username" required placeholder="Masukkan username atau email" class="neo-input w-full bg-white rounded-xl px-3.5 py-2.5 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[11px] font-black uppercase font-cyber text-black">
                            PASSWORD
                        </label>
                    </div>
                    <div class="relative">
                        <input id="login-password" type="password" name="password" required placeholder="Min. 8 karakter" class="neo-input w-full bg-white rounded-xl pl-3.5 pr-12 py-2.5 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                        <button type="button" onclick="togglePassword('login-password', 'eye-svg-login')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-black hover:text-amber-600 transition">
                            <span id="eye-svg-login">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>

                <div class="neo-input p-2.5 bg-amber-50/60 rounded-xl flex items-center gap-2.5">
                    <input type="checkbox" id="terms-login" onchange="toggleFormButtons('login')" class="w-4 h-4 accent-amber-400 border-2 border-black rounded cursor-pointer shrink-0">
                    <label for="terms-login" class="text-[11px] font-bold text-slate-800 leading-snug cursor-pointer select-none">
                        Saya menyetujui <a href="/privacy" target="_blank" class="text-amber-700 font-black underline hover:bg-neoYellow px-0.5 rounded">Syarat & Kebijakan Privasi</a> layanan.
                    </label>
                </div>

                <button type="submit" id="btnSubmitLogin" disabled class="neo-btn btn-disabled w-full bg-neoYellow text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 mt-1">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i> MASUK KE AKUN
                </button>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t-2 border-black"></div>
                <span class="flex-shrink mx-2 text-black text-[9px] font-black font-cyber uppercase bg-neoBg px-2.5 py-0.5 border border-black rounded-md shadow-[1px_1px_0px_#000]">
                    atau
                </span>
                <div class="flex-grow border-t-2 border-black"></div>
            </div>

            <div class="space-y-2">
                <a id="btnGithubAuth" href="/auth/github" class="neo-btn btn-disabled flex items-center justify-center gap-2.5 bg-neoCyan text-black py-2.5 rounded-xl text-xs font-black font-cyber uppercase w-full">
                    <i class="fa-brands fa-github text-lg leading-none"></i> DAFTAR DENGAN GITHUB
                </a>
                <a id="btnGoogleAuth" href="/auth/google" class="neo-btn btn-disabled flex items-center justify-center gap-2.5 bg-white text-black py-2.5 rounded-xl text-xs font-black font-cyber uppercase w-full">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5 object-contain" alt="Google"> DAFTAR DENGAN GOOGLE
                </a>
            </div>
        </div>

        <!-- ================= FORM SIGN UP ================= -->
        <div id="signup-form" class="space-y-3 relative z-10 hidden-form my-1">
            <form id="registerForm" action="/auth/register" method="POST" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-0.5">NAMA LENGKAP / USERNAME</label>
                    <input type="text" name="username" required placeholder="Nama kamu" class="neo-input w-full bg-white rounded-xl px-3.5 py-2 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-0.5">EMAIL ADDRESS</label>
                    <input type="email" id="register-email" name="email" required placeholder="emailkamu.com" class="neo-input w-full bg-white rounded-xl px-3.5 py-2 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-0.5">PASSWORD</label>
                    <div class="relative">
                        <input id="register-password" type="password" name="password" required placeholder="Min. 8 karakter" class="neo-input w-full bg-white rounded-xl pl-3.5 pr-12 py-2 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                        <button type="button" onclick="togglePassword('register-password', 'eye-svg-register')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-black hover:text-amber-600 transition">
                            <span id="eye-svg-register">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-0.5 flex items-center justify-between">
                        <span>KODE REFERAL</span>
                        <span class="text-[9px] bg-neoGreen text-black border border-black font-bold px-1 rounded lowercase">(Bonus Rp 500)</span>
                    </label>
                    <input type="text" id="referralCodeInput" name="referralCode" placeholder="Kode undangan (opsional)" class="neo-input w-full bg-white rounded-xl px-3.5 py-2 text-xs font-mono font-black text-black uppercase placeholder-slate-400 focus:outline-none transition">
                </div>

                <div class="neo-input p-2 bg-amber-50/60 rounded-xl flex items-center gap-2">
                    <input type="checkbox" id="terms-register" onchange="toggleFormButtons('register')" class="w-4 h-4 accent-amber-400 border-2 border-black rounded cursor-pointer shrink-0">
                    <label for="terms-register" class="text-[10px] font-bold text-slate-800 leading-tight cursor-pointer select-none">
                        Saya menyetujui <a href="/privacy" target="_blank" class="text-amber-700 font-black underline hover:bg-neoYellow px-0.5 rounded">Syarat & Kebijakan Privasi</a> layanan.
                    </label>
                </div>

                <button type="submit" id="btnSubmitRegister" disabled class="neo-btn btn-disabled w-full bg-neoGreen text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-xs"></i> DAFTAR SEKARANG
                </button>
            </form>

            <div class="relative flex py-0.5 items-center">
                <div class="flex-grow border-t-2 border-black"></div>
                <span class="flex-shrink mx-2 text-black text-[9px] font-black font-cyber uppercase bg-neoBg px-2 py-0.5 border border-black rounded-md shadow-[1px_1px_0px_#000]">
                    atau
                </span>
                <div class="flex-grow border-t-2 border-black"></div>
            </div>

            <div class="space-y-2">
                <a id="btnGithubAuthRegister" href="/auth/github" class="neo-btn btn-disabled flex items-center justify-center gap-2.5 bg-neoCyan text-black py-2.5 rounded-xl text-xs font-black font-cyber uppercase w-full">
                    <i class="fa-brands fa-github text-lg leading-none"></i> DAFTAR DENGAN GITHUB
                </a>
                <a id="btnGoogleAuthRegister" href="/auth/google" class="neo-btn btn-disabled flex items-center justify-center gap-2.5 bg-white text-black py-2.5 rounded-xl text-xs font-black font-cyber uppercase w-full">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5 object-contain" alt="Google"> DAFTAR DENGAN GOOGLE
                </a>
            </div>
        </div>

        <!-- ================= FORM FORGOT PASSWORD (OTP 6 DIGIT) ================= -->
        <div id="forgot-form" class="space-y-3.5 relative z-10 hidden-form my-1">
            <form id="forgotForm" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-1">EMAIL ADDRESS TERDAFTAR</label>
                    <div class="flex gap-2">
                        <input type="email" id="forgot-email" name="email" required placeholder="emailkamu.com" class="neo-input w-full bg-white rounded-xl px-3.5 py-2.5 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                        <button type="button" onclick="requestForgotPasswordOTP()" class="neo-btn bg-neoCyan text-black text-xs font-black font-cyber px-3 py-2.5 rounded-xl uppercase whitespace-nowrap">KIRIM OTP</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-1">KODE OTP 6 DIGIT</label>
                    <input type="text" id="forgot-otp" maxLength="6" placeholder="123456" class="neo-input w-full bg-white rounded-xl px-3.5 py-2.5 text-xs font-mono font-black tracking-widest text-black placeholder-slate-400 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-[11px] font-black uppercase font-cyber text-black mb-1">PASSWORD BARU</label>
                    <input type="password" id="forgot-new-password" placeholder="••••••••" class="neo-input w-full bg-white rounded-xl px-3.5 py-2.5 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>

                <button type="submit" class="neo-btn w-full bg-neoPink text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider">SIMPAN PASSWORD BARU</button>
            </form>
        </div>

        <!-- FOOTER BADGES -->
        <div class="pt-3 mt-3 border-t-2 border-black flex items-center justify-around text-[9px] sm:text-[10px] font-black font-cyber text-black">
            <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-neoGreen"></i> 100% Aman</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-neoYellow"></i> Otomatis</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-headset text-neoCyan"></i> Fast Response</span>
        </div>

    </div>

    <script>
        const swalConfig = {
            customClass: { popup: 'cyber-swal' },
            buttonsStyling: false
        };

        const eyeOpenSvg = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>`;

        const eyeClosedSvg = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.959 8.959 0 013.682-.783c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-6.115-3.486a3 3 0 11-4.243-4.243" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
        </svg>`;

        function togglePassword(inputId, svgContainerId) {
            const passwordInput = document.getElementById(inputId);
            const svgContainer = document.getElementById(svgContainerId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                svgContainer.innerHTML = eyeClosedSvg;
            } else {
                passwordInput.type = 'password';
                svgContainer.innerHTML = eyeOpenSvg;
            }
        }

        // FUNGSI MEMATIKAN & MENGAKTIFKAN TOMBOL DENGAN STATE OPACITY
        function toggleFormButtons(mode) {
            if (mode === 'login') {
                const isChecked = document.getElementById('terms-login').checked;
                const btnSubmit = document.getElementById('btnSubmitLogin');
                const btnGithub = document.getElementById('btnGithubAuth');
                const btnGoogle = document.getElementById('btnGoogleAuth');

                if (isChecked) {
                    btnSubmit.removeAttribute('disabled');
                    btnSubmit.classList.remove('btn-disabled');
                    btnGithub.classList.remove('btn-disabled');
                    btnGoogle.classList.remove('btn-disabled');
                } else {
                    btnSubmit.setAttribute('disabled', 'true');
                    btnSubmit.classList.add('btn-disabled');
                    btnGithub.classList.add('btn-disabled');
                    btnGoogle.classList.add('btn-disabled');
                }
            } else if (mode === 'register') {
                const isChecked = document.getElementById('terms-register').checked;
                const btnSubmit = document.getElementById('btnSubmitRegister');
                const btnGithub = document.getElementById('btnGithubAuthRegister');
                const btnGoogle = document.getElementById('btnGoogleAuthRegister');

                if (isChecked) {
                    btnSubmit.removeAttribute('disabled');
                    btnSubmit.classList.remove('btn-disabled');
                    btnGithub.classList.remove('btn-disabled');
                    btnGoogle.classList.remove('btn-disabled');
                } else {
                    btnSubmit.setAttribute('disabled', 'true');
                    btnSubmit.classList.add('btn-disabled');
                    btnGithub.classList.add('btn-disabled');
                    btnGoogle.classList.add('btn-disabled');
                }
            }
        }

        function switchTab(formType) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const forgotForm = document.getElementById('forgot-form');

            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const tabForgot = document.getElementById('tab-forgot');

            signinForm.classList.add('hidden-form');
            signupForm.classList.add('hidden-form');
            forgotForm.classList.add('hidden-form');

            tabLogin.classList.remove('active');
            tabRegister.classList.remove('active');
            tabForgot.classList.remove('active');

            if (formType === 'signin') {
                signinForm.classList.remove('hidden-form');
                tabLogin.classList.add('active');
            } else if (formType === 'signup') {
                signupForm.classList.remove('hidden-form');
                tabRegister.classList.add('active');
            } else if (formType === 'forgot') {
                forgotForm.classList.remove('hidden-form');
                tabForgot.classList.add('active');
            }
        }

        // FUNGSI REQUEST OTP SECARA OTOMATIS
        async function sendOTPRequest(email, type) {
            const res = await fetch('/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, type })
            });
            return await res.json();
        }

        async function requestForgotPasswordOTP() {
            const email = document.getElementById('forgot-email').value;
            if (!email || !email.includes('@')) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Email Diperlukan',
                    text: 'Masukkan alamat email yang valid terlebih dahulu!'
                });
                return;
            }

            Swal.fire({
                ...swalConfig,
                title: 'Mengirim OTP...',
                text: 'Mohon tunggu sejenak',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const data = await sendOTPRequest(email, 'forgot');
                if (data.status) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'success',
                        title: 'Kode Dikirim!',
                        text: data.message
                    });
                } else {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'error',
                        title: 'Gagal Kirim OTP',
                        text: data.message
                    });
                }
            } catch (err) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'error',
                    title: 'Error Server',
                    text: 'Gagal menghubungkan ke server.'
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');

            if (refCode) {
                const cleanRef = refCode.trim().toUpperCase();
                document.cookie = `pending_ref=${cleanRef}; path=/; max-age=86400`;

                switchTab('signup');

                const refInput = document.getElementById('referralCodeInput');
                if (refInput) {
                    refInput.value = cleanRef;
                    refInput.readOnly = true;
                    refInput.classList.add('bg-slate-100', 'cursor-not-allowed');
                }

                const btnGoogleLogin = document.getElementById('btnGoogleAuth');
                const btnGithubLogin = document.getElementById('btnGithubAuth');
                const btnGoogleReg = document.getElementById('btnGoogleAuthRegister');
                const btnGithubReg = document.getElementById('btnGithubAuthRegister');

                if (btnGoogleLogin) btnGoogleLogin.href = `/auth/google?ref=${cleanRef}`;
                if (btnGithubLogin) btnGithubLogin.href = `/auth/github?ref=${cleanRef}`;
                if (btnGoogleReg) btnGoogleReg.href = `/auth/google?ref=${cleanRef}`;
                if (btnGithubReg) btnGithubReg.href = `/auth/github?ref=${cleanRef}`;
            }
        });

        // MASUK KE AKUN -> OTOMATIS KIRIM OTP -> MINTA INPUT OTP
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formTarget = e.target;
            const terms = document.getElementById('terms-login');
            const email = document.getElementById('login-username').value;

            if (!terms.checked) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Persetujuan Diperlukan',
                    text: 'Anda harus menyetujui Syarat & Kebijakan Privasi terlebih dahulu!'
                });
                return;
            }

            if (!email || !email.trim()) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Username/Email Diperlukan',
                    text: 'Masukkan Username atau Email Anda!'
                });
                return;
            }

            Swal.fire({
                ...swalConfig,
                title: 'Mengirim Kode OTP...',
                text: 'Memproses pengiriman kode verifikasi 6 digit ke email Anda',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const otpRes = await sendOTPRequest(email, 'login');

                if (!otpRes.status) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'error',
                        title: 'Gagal Kirim OTP',
                        text: otpRes.message
                    });
                    return;
                }

                // Modal Pop-Up Memasukkan Kode OTP 6 Digit
                const { value: otpCode } = await Swal.fire({
                    ...swalConfig,
                    title: 'Verifikasi Kode OTP',
                    text: `Kode verifikasi 6 digit telah dikirim ke email Anda (${email}). Silakan masukkan di bawah ini:`,
                    input: 'text',
                    inputPlaceholder: '123456',
                    inputAttributes: {
                        maxlength: '6',
                        autocapitalize: 'off',
                        autocorrect: 'off',
                        style: 'text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 6px;'
                    },
                    showCancelButton: true,
                    confirmButtonText: 'VERIFIKASI & MASUK',
                    cancelButtonText: 'BATAL',
                    customClass: {
                        confirmButton: 'neo-btn bg-neoYellow text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber mr-2',
                        cancelButton: 'neo-btn bg-white text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber'
                    },
                    inputValidator: (val) => {
                        if (!val || val.length !== 6) {
                            return 'Kode OTP harus berjumlah 6 digit angka!';
                        }
                    }
                });

                if (otpCode) {
                    Swal.fire({
                        ...swalConfig,
                        title: 'Memverifikasi...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const verifyRes = await fetch('/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code: otpCode, type: 'login' })
                    });

                    const verifyData = await verifyRes.json();
                    if (!verifyData.status) {
                        Swal.fire({
                            ...swalConfig,
                            icon: 'error',
                            title: 'OTP Tidak Valid',
                            text: verifyData.message
                        });
                        return;
                    }

                    formTarget.submit();
                }
            } catch (err) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'error',
                    title: 'Kesalahan Sistem',
                    text: 'Gagal memproses verifikasi login.'
                });
            }
        });

        // DAFTAR SEKARANG -> OTOMATIS KIRIM OTP -> MINTA INPUT OTP
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formTarget = e.target;
            const terms = document.getElementById('terms-register');
            const email = document.getElementById('register-email').value;

            if (!terms.checked) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Persetujuan Diperlukan',
                    text: 'Anda harus menyetujui Syarat & Kebijakan Privasi terlebih dahulu!'
                });
                return;
            }

            if (!email || !email.includes('@')) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Email Tidak Valid',
                    text: 'Masukkan alamat email yang valid untuk mendaftar!'
                });
                return;
            }

            Swal.fire({
                ...swalConfig,
                title: 'Mengirim Kode OTP...',
                text: 'Memproses pengiriman kode verifikasi 6 digit ke email Anda',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const otpRes = await sendOTPRequest(email, 'register');

                if (!otpRes.status) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'error',
                        title: 'Gagal Kirim OTP',
                        text: otpRes.message
                    });
                    return;
                }

                // Modal Pop-Up Memasukkan Kode OTP 6 Digit
                const { value: otpCode } = await Swal.fire({
                    ...swalConfig,
                    title: 'Verifikasi Email Pendaftaran',
                    text: `Kode verifikasi 6 digit telah dikirim ke email ${email}. Masukkan kode di bawah:`,
                    input: 'text',
                    inputPlaceholder: '123456',
                    inputAttributes: {
                        maxlength: '6',
                        autocapitalize: 'off',
                        autocorrect: 'off',
                        style: 'text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 6px;'
                    },
                    showCancelButton: true,
                    confirmButtonText: 'VERIFIKASI & DAFTAR',
                    cancelButtonText: 'BATAL',
                    customClass: {
                        confirmButton: 'neo-btn bg-neoGreen text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber mr-2',
                        cancelButton: 'neo-btn bg-white text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber'
                    },
                    inputValidator: (val) => {
                        if (!val || val.length !== 6) {
                            return 'Kode OTP harus berjumlah 6 digit angka!';
                        }
                    }
                });

                if (otpCode) {
                    Swal.fire({
                        ...swalConfig,
                        title: 'Memverifikasi...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const verifyRes = await fetch('/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code: otpCode, type: 'register' })
                    });

                    const verifyData = await verifyRes.json();
                    if (!verifyData.status) {
                        Swal.fire({
                            ...swalConfig,
                            icon: 'error',
                            title: 'OTP Tidak Valid',
                            text: verifyData.message
                        });
                        return;
                    }

                    formTarget.submit();
                }
            } catch (err) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'error',
                    title: 'Kesalahan Sistem',
                    text: 'Gagal memproses pendaftaran.'
                });
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const code = document.getElementById('forgot-otp').value;
            const newPassword = document.getElementById('forgot-new-password').value;

            if (!email || !code || !newPassword) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'warning',
                    title: 'Wajib Diisi',
                    text: 'Semua bidang wajib diisi!'
                });
                return;
            }

            Swal.fire({
                ...swalConfig,
                title: 'Memproses Reset...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const res = await fetch('/auth/reset-password-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword })
                });

                const data = await res.json();
                if (data.status) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'success',
                        title: 'Berhasil Reset Password!',
                        text: data.message
                    }).then(() => {
                        switchTab('signin');
                    });
                } else {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'error',
                        title: 'Gagal Reset Password',
                        text: data.message
                    });
                }
            } catch (err) {
                Swal.fire({
                    ...swalConfig,
                    icon: 'error',
                    title: 'Error Server',
                    text: 'Terjadi kesalahan pada server.'
                });
            }
        });

        let currentProgress = 0;
        const progressFill = document.getElementById('loader-progress-fill');
        const percentageText = document.getElementById('loader-percentage');
        const loaderOverlay = document.getElementById('cyber-loader-overlay');

        function updateProgress(targetVal) {
            currentProgress = Math.min(Math.max(currentProgress, targetVal), 100);
            if (progressFill) progressFill.style.width = currentProgress + '%';
            if (percentageText) percentageText.innerText = Math.floor(currentProgress) + '%';
        }

        const progressInterval = setInterval(() => {
            if (currentProgress < 85) {
                const increment = Math.random() * 12 + 5;
                updateProgress(currentProgress + increment);
            }
        }, 120);

        window.addEventListener('load', () => {
            clearInterval(progressInterval);
            updateProgress(100);

            setTimeout(() => {
                if (loaderOverlay) loaderOverlay.classList.add('fade-out');
            }, 400);
        });

        setTimeout(() => {
            clearInterval(progressInterval);
            updateProgress(100);
            if (loaderOverlay && !loaderOverlay.classList.contains('fade-out')) {
                loaderOverlay.classList.add('fade-out');
            }
        }, 3500);
    </script>
</body>
</html>
