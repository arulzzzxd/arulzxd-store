<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentikasi - ArulzXD STORE</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        neoYellow: '#FFDE59',
                        neoCyan: '#00E5FF',
                        neoPink: '#FF79C6',
                        neoGreen: '#00E676',
                        neoBg: '#F4F0EA',
                        neoCard: '#FFFFFF'
                    }
                } 
            }
        }
    </script>
    <style>
        body { 
            background-color: #F4F0EA; 
            color: #000000;
        }
        
        .neo-box {
            background-color: #FFFFFF;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }

        .neo-btn {
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .neo-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        .neo-input {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.15s ease;
        }
        .neo-input:focus {
            box-shadow: 5px 5px 0px #000000;
            background-color: #FFFFFF;
        }

        .hidden-form { display: none; }

        .swal2-popup.cyber-swal {
            background: #FFFFFF !important;
            border: 3px solid #000000 !important;
            border-radius: 20px !important;
            color: #000000 !important;
            box-shadow: 6px 6px 0px #000000 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        #cyber-loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #F4F0EA;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #cyber-loader-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .animated-dots::after {
            content: '';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotsAnimation 1.5s steps(4, end) infinite;
        }
        @keyframes dotsAnimation {
            0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 antialiased text-black">

    <!-- LOADER OVERLAY -->
    <div id="cyber-loader-overlay">
        <div class="neo-box p-6 rounded-2xl flex flex-col items-center bg-white">
            <img src="https://files.catbox.moe/kdowze.png" alt="Logo" class="w-20 h-20 rounded-full border-3 border-black mb-4 shadow-[4px_4px_0px_#000]">
            <div id="loader-title-text" class="text-base font-black tracking-wider uppercase font-cyber mb-1">
                Memuat Halaman Login<span class="animated-dots"></span>
            </div>
            <div class="text-[11px] font-bold font-mono tracking-wider uppercase bg-neoYellow border-2 border-black px-2 py-0.5">
                SYSTEM INITIALIZING
            </div>
            <div class="w-64 mt-6">
                <div class="flex items-center justify-between text-xs font-black font-cyber mb-1">
                    <span>STATUS</span>
                    <span id="loader-percentage">0%</span>
                </div>
                <div class="w-full h-4 bg-white rounded-none border-3 border-black p-0.5">
                    <div id="loader-progress-fill" class="h-full bg-neoCyan w-0 border-r-2 border-black"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN FORM CARD -->
    <div class="neo-box p-6 sm:p-8 rounded-2xl w-full max-w-md bg-white relative overflow-hidden">
        
        <div class="text-center mb-6 relative z-10">
            <h1 class="text-3xl font-black font-cyber tracking-tight text-black mb-1">
                Arulz<span class="bg-neoYellow border-2 border-black px-2 py-0.5 ml-1 rounded-md shadow-[2px_2px_0px_#000]">STORE</span>
            </h1>
            <p id="form-description" class="text-xs font-bold text-slate-700 mt-2">Masuk untuk mengelola akun Anda.</p>
        </div>

        <!-- ================= FORM SIGN IN ================= -->
        <div id="signin-form" class="space-y-4 relative z-10">
            <form id="loginForm" action="/auth/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5">Username / Email</label>
                    <input type="text" name="username" required placeholder="Masukkan username atau email" class="neo-input w-full bg-white rounded-xl px-4 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-black uppercase font-cyber text-black">Kata Sandi</label>
                        <button type="button" onclick="switchForm('forgot')" class="text-xs font-black font-cyber text-black underline hover:bg-neoYellow px-1 rounded">Lupa Password?</button>
                    </div>
                    <div class="relative">
                        <input id="login-password" type="password" name="password" required placeholder="••••••••" class="neo-input w-full bg-white rounded-xl pl-4 pr-12 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                        <button type="button" onclick="togglePassword('login-password', 'eye-icon-login')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-black transition">
                            <i id="eye-icon-login" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="neo-btn w-full bg-neoYellow text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider">Masuk</button>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t-2 border-black"></div>
                <span class="flex-shrink mx-3 text-black text-[10px] font-black font-cyber uppercase bg-neoBg px-2 py-0.5 border border-black rounded">Atau masuk dengan</span>
                <div class="flex-grow border-t-2 border-black"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <a id="btnGoogleAuth" href="/auth/google" class="neo-btn flex items-center justify-center gap-2 bg-white text-black py-2.5 rounded-xl text-xs font-black font-cyber">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-4 h-4" alt="Google"> Google
                </a>
                <a id="btnGithubAuth" href="/auth/github" class="neo-btn flex items-center justify-center gap-2 bg-neoCyan text-black py-2.5 rounded-xl text-xs font-black font-cyber">
                    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" class="w-4 h-4" alt="GitHub"> GitHub
                </a>
            </div>

            <p class="text-center text-xs font-bold text-slate-700 mt-4">Belum punya akun? <button onclick="switchForm('signup')" class="text-black font-black underline hover:bg-neoGreen px-1 rounded">Daftar sekarang</button></p>
        </div>

        <!-- ================= FORM SIGN UP ================= -->
        <div id="signup-form" class="space-y-4 relative z-10 hidden-form">
            <form id="registerForm" action="/auth/register" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5">Username</label>
                    <input type="text" name="username" required placeholder="pilih username" class="neo-input w-full bg-white rounded-xl px-4 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5">Alamat Email</label>
                    <input type="email" name="email" required placeholder="nama@email.com" class="neo-input w-full bg-white rounded-xl px-4 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <input id="register-password" type="password" name="password" required placeholder="••••••••" class="neo-input w-full bg-white rounded-xl pl-4 pr-12 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                        <button type="button" onclick="togglePassword('register-password', 'eye-icon-register')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-black transition">
                            <i id="eye-icon-register" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5 flex items-center justify-between">
                        <span>Kode Referal / Undangan</span>
                        <span class="text-[10px] bg-neoGreen text-black border border-black font-bold px-1.5 rounded lowercase">(bonus saldo Rp 500)</span>
                    </label>
                    <input type="text" id="referralCodeInput" name="referralCode" placeholder="Masukkan kode undangan (opsional)" class="neo-input w-full bg-white rounded-xl px-4 py-3 text-xs font-mono font-black text-black uppercase placeholder-slate-400 focus:outline-none transition">
                </div>

                <button type="submit" class="neo-btn w-full bg-neoGreen text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider">Buat Akun Baru</button>
            </form>
            <p class="text-center text-xs font-bold text-slate-700 mt-4">Sudah punya akun? <button onclick="switchForm('signin')" class="text-black font-black underline hover:bg-neoYellow px-1 rounded">Masuk</button></p>
        </div>

        <!-- ================= FORM FORGOT PASSWORD ================= -->
        <div id="forgot-form" class="space-y-4 relative z-10 hidden-form">
            <form id="forgotForm" action="/auth/forgot-password" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-black uppercase font-cyber text-black mb-1.5">Alamat Email Terdaftar</label>
                    <input type="email" name="email" required placeholder="nama@email.com" class="neo-input w-full bg-white rounded-xl px-4 py-3 text-xs font-bold text-black placeholder-slate-400 focus:outline-none transition">
                </div>
                <button type="submit" class="neo-btn w-full bg-neoPink text-black font-black font-cyber py-3 rounded-xl text-xs uppercase tracking-wider">Kirim Instruksi Reset</button>
            </form>
            <p class="text-center text-xs font-bold text-slate-700 mt-4"><button onclick="switchForm('signin')" class="text-black font-black underline hover:bg-neoYellow px-1 rounded">Kembali ke Halaman Login</button></p>
        </div>

    </div>

    <script>
        const swalConfig = {
            customClass: { popup: 'cyber-swal' },
            buttonsStyling: false
        };

        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye text-sm';
            }
        }

        function switchForm(formType) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const forgotForm = document.getElementById('forgot-form');
            const description = document.getElementById('form-description');

            signinForm.classList.add('hidden-form');
            signupForm.classList.add('hidden-form');
            forgotForm.classList.add('hidden-form');

            if (formType === 'signin') {
                signinForm.classList.remove('hidden-form');
                description.innerText = "Masuk untuk mengelola akses STORE Anda.";
            } else if (formType === 'signup') {
                signupForm.classList.remove('hidden-form');
                description.innerText = "Daftarkan akun baru Anda secara gratis.";
            } else if (formType === 'forgot') {
                forgotForm.classList.remove('hidden-form');
                description.innerText = "Masukkan email Anda untuk memproses penyetelan ulang sandi.";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');

            if (refCode) {
                const cleanRef = refCode.trim().toUpperCase();
                document.cookie = `pending_ref=${cleanRef}; path=/; max-age=86400`;

                switchForm('signup');

                const refInput = document.getElementById('referralCodeInput');
                if (refInput) {
                    refInput.value = cleanRef;
                    refInput.readOnly = true;
                    refInput.classList.add('bg-slate-100', 'cursor-not-allowed');
                }

                const btnGoogle = document.getElementById('btnGoogleAuth');
                const btnGithub = document.getElementById('btnGithubAuth');

                if (btnGoogle) btnGoogle.href = `/auth/google?ref=${cleanRef}`;
                if (btnGithub) btnGithub.href = `/auth/github?ref=${cleanRef}`;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'success',
                title: 'Autentikasi Berhasil',
                text: 'Memproses login Anda, mohon tunggu...',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                e.target.submit();
            });
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'success',
                title: 'Pendaftaran Berhasil',
                text: 'Akun Anda berhasil dibuat! Mengalihkan ke dashboard...',
                confirmButtonText: 'Lanjutkan',
                customClass: { confirmButton: 'neo-btn bg-neoGreen text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber' }
            }).then((result) => {
                if (result.isConfirmed) {
                    e.target.submit();
                }
            });
        });

        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'info',
                title: 'Instruksi Dikirim',
                text: 'Silakan periksa kotak masuk email Anda untuk menyetel ulang kata sandi.',
                confirmButtonText: 'Mengerti',
                customClass: { confirmButton: 'neo-btn bg-neoYellow text-black font-black px-4 py-2 rounded-xl text-xs uppercase font-cyber' }
            }).then((result) => {
                if (result.isConfirmed) {
                    e.target.submit();
                }
            });
        });

        let currentProgress = 0;
        const progressFill = document.getElementById('loader-progress-fill');
        const percentageText = document.getElementById('loader-percentage');
        const loaderOverlay = document.getElementById('cyber-loader-overlay');

        function updateProgress(targetVal) {
            currentProgress = Math.min(Math.max(currentProgress, targetVal), 100);
            if (progressFill) progressFill.style.width = currentProgress + '%';
            if (percentageText) percentageText.innerText = Math.floor(currentProgress) + '%';
        }

        const progressInterval = setInterval(() => {
            if (currentProgress < 85) {
                const increment = Math.random() * 12 + 5;
                updateProgress(currentProgress + increment);
            }
        }, 120);

        window.addEventListener('load', () => {
            clearInterval(progressInterval);
            updateProgress(100);

            setTimeout(() => {
                if (loaderOverlay) loaderOverlay.classList.add('fade-out');
            }, 400);
        });

        setTimeout(() => {
            clearInterval(progressInterval);
            updateProgress(100);
            if (loaderOverlay && !loaderOverlay.classList.contains('fade-out')) {
                loaderOverlay.classList.add('fade-out');
            }
        }, 3500);
    </script>
</body>
</html>
